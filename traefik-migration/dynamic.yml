http:
  middlewares:
    security-headers:
      headers:
        customResponseHeaders:
          X-Robots-Tag: "none,noarchive,nosnippet,notranslate,noimageindex"
          Server: ""
        sslProxyHeaders:
          X-Forwarded-Proto: https
        contentSecurityPolicy: "upgrade-insecure-requests"
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "strict-origin-when-cross-origin"

    compress:
      compress: {}

    bw-ws-headers:
      headers:
        customRequestHeaders:
          X-Real-IP: "{client_ip}"

  routers:
    adguard:
      rule: "Host(`adguard.tbs.amn.gg`) || Host(`adguard.tailscale.amn.gg`)"
      service: adguard
      tls:
        certResolver: porkbun
      middlewares:
        - security-headers
        - compress

    amn-wellknown-server:
      rule: "(Host(`amn.gg`) || Host(`amn.tailscale.amn.gg`)) && Path(`/.well-known/matrix/server`)"
      service: dendrite-wellknown-server
      tls:
        certResolver: porkbun
      middlewares:
        - security-headers

    amn-wellknown-client:
      rule: "(Host(`amn.gg`) || Host(`amn.tailscale.amn.gg`)) && Path(`/.well-known/matrix/client`)"
      service: dendrite-wellknown-client
      tls:
        certResolver: porkbun
      middlewares:
        - security-headers

    amn-default:
      rule: "Host(`amn.gg`) || Host(`amn.tailscale.amn.gg`)"
      service: dendrite
      tls:
        certResolver: porkbun
      middlewares:
        - security-headers
        - compress

    arcane:
      rule: "Host(`arcane.tbs.amn.gg`) || Host(`arcane.tailscale.amn.gg`)"
      service: arcane
      tls:
        certResolver: porkbun
      middlewares:
        - security-headers
        - compress

    bitwarden-notifications:
      rule: "(Host(`bitwarden.amn.gg`) || Host(`bitwarden.tbs.amn.gg`) || Host(`bt.tbs.amn.gg`) || Host(`bitwarden.tailscale.amn.gg`)) && PathPrefix(`/notifications/hub`)"
      service: bitwarden-ws
      tls:
        certResolver: porkbun
      middlewares:
        - bw-ws-headers

    bitwarden:
      rule: "Host(`bitwarden.amn.gg`) || Host(`bitwarden.tbs.amn.gg`) || Host(`bt.tbs.amn.gg`) || Host(`bitwarden.tailscale.amn.gg`)"
      service: bitwarden
      tls:
        certResolver: porkbun
      middlewares:
        - security-headers
        - compress

    git:
      rule: "Host(`git.tbs.amn.gg`) || Host(`git.tailscale.amn.gg`)"
      service: forgejo
      tls:
        certResolver: porkbun
      middlewares:
        - security-headers
        - compress

    grafana:
      rule: "Host(`grafana.tbs.amn.gg`) || Host(`grafana.tailscale.amn.gg`)"
      service: grafana
      tls:
        certResolver: porkbun
      middlewares:
        - security-headers
        - compress

    matrix-wellknown-server:
      rule: "(Host(`matrix.amn.gg`) || Host(`matrix.tailscale.amn.gg`)) && Path(`/.well-known/matrix/server`)"
      service: dendrite-wellknown-server
      tls:
        certResolver: porkbun
      middlewares:
        - security-headers

    matrix-wellknown-client:
      rule: "(Host(`matrix.amn.gg`) || Host(`matrix.tailscale.amn.gg`)) && Path(`/.well-known/matrix/client`)"
      service: dendrite-wellknown-client
      tls:
        certResolver: porkbun
      middlewares:
        - security-headers

    matrix-default:
      rule: "Host(`matrix.amn.gg`) || Host(`matrix.tailscale.amn.gg`)"
      service: dendrite
      tls:
        certResolver: porkbun
      middlewares:
        - security-headers
        - compress

    maxun-api:
      rule: "Host(`maxun-api.tbs.amn.gg`) || Host(`maxun-api.tailscale.amn.gg`)"
      service: maxun-api
      tls:
        certResolver: porkbun
      middlewares:
        - security-headers
        - compress

    maxun:
      rule: "Host(`maxun.tbs.amn.gg`) || Host(`maxun.tailscale.amn.gg`)"
      service: maxun
      tls:
        certResolver: porkbun
      middlewares:
        - security-headers
        - compress

    metube:
      rule: "Host(`metube.tbs.amn.gg`) || Host(`metube.tailscale.amn.gg`)"
      service: metube
      tls:
        certResolver: porkbun
      middlewares:
        - security-headers
        - compress

    stash-manwe:
      rule: "Host(`stash.manwe.amn.gg`) || Host(`stash-manwe.tailscale.amn.gg`)"
      service: stash
      tls:
        certResolver: porkbun
      middlewares:
        - security-headers
        - compress

    stash-tbs:
      rule: "Host(`stash.tbs.amn.gg`) || Host(`stash.tailscale.amn.gg`)"
      service: stash
      tls:
        certResolver: porkbun
      middlewares:
        - security-headers
        - compress

    warsmash:
      rule: "Host(`warsmash.tbs.amn.gg`) || Host(`warsmash.tailscale.amn.gg`)"
      service: warsmash
      tls:
        certResolver: porkbun
      middlewares:
        - security-headers
        - compress

    traefik-dash:
      rule: "Host(`nginx.tbs.amn.gg`) || Host(`traefik.tailscale.amn.gg`)"
      service: api@internal
      tls:
        certResolver: porkbun

  services:
    adguard:
      loadBalancer:
        servers:
          - url: "http://adguard-adguardhome-1:80"

    dendrite:
      loadBalancer:
        servers:
          - url: "http://chatserver-dendrite-1:8008"

    dendrite-wellknown-server:
      loadBalancer:
        servers:
          - url: "http://chatserver-dendrite-1:8008"

    dendrite-wellknown-client:
      loadBalancer:
        servers:
          - url: "http://chatserver-dendrite-1:8006"

    arcane:
      loadBalancer:
        servers:
          - url: "http://arcane:3552"

    bitwarden:
      loadBalancer:
        servers:
          - url: "http://bitwarden-bitwarden-1:80"

    bitwarden-ws:
      loadBalancer:
        servers:
          - url: "http://bitwarden-bitwarden-1:3012"

    forgejo:
      loadBalancer:
        servers:
          - url: "http://forgejo:3000"

    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"

    maxun-api:
      loadBalancer:
        servers:
          - url: "http://172.16.81.175:8080"

    maxun:
      loadBalancer:
        servers:
          - url: "http://172.16.81.175:5173"

    metube:
      loadBalancer:
        servers:
          - url: "http://metube:8081"

    stash:
      loadBalancer:
        servers:
          - url: "http://stash:9999"

    warsmash:
      loadBalancer:
        servers:
          - url: "http://warsmash:80"
